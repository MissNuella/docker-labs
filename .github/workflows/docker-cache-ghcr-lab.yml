name: Docker Cache and GHCR Lab

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.generate.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: app-v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Image Tag
        id: generate
        run: |
          echo "image_tag=app-v1.0" >> "$GITHUB_OUTPUT"


  security:
    needs: build
    runs-on: ubuntu-latest

    outputs:
      scan_result: ${{ steps.scan.outputs.scan_result }}

    steps:
      - name: Security Scan
        id: scan
        run: |
          echo "Scanning image: ${{ needs.build.outputs.image_tag }}"
          echo "scan_result=PASS" >> "$GITHUB_OUTPUT"


  publish:
    needs:
      - build
      - security

    if: ${{ needs.security.outputs.scan_result == 'PASS' }}

    runs-on: ubuntu-latest

    permissions:
        contents: read
        packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/missnuella/docker-labs:${{ needs.build.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
